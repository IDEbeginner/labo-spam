<style>
/* Mise en page: atelier de deck — barre d'onglets, colonne de construction + panneau de résultats; couleurs des 6 éléments comme repères */
:root {
  --bg: #f5f2fa; --surface: #ffffff; --surface2: #efe9f7; --line: #ddd4ea; --fg: #221a2e; --muted: #6b5f80;
  --accent: #6b3fd0; --accent-fg: #ffffff; --good: #1f8a4c; --bad: #c2384b; --warn: #b7791f;
  --F: #d9531e; --W: #1f7fc4; --E: #9a6a3a; --N: #3f9a2c; --S: #7e48d8; --L: #b8900f;
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16121d; --surface: #201a2a; --surface2: #2a2236; --line: #3a3049; --fg: #ece6f5; --muted: #a698ba;
  --accent: #b48cff; --accent-fg: #1a1222; --good: #4fd18b; --bad: #ff6b81; --warn: #f0b85a;
  --F: #ff8a4c; --W: #4fb8ff; --E: #d29a63; --N: #82d35e; --S: #b07cff; --L: #f2d15b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16121d; --surface: #201a2a; --surface2: #2a2236; --line: #3a3049; --fg: #ece6f5; --muted: #a698ba;
  --accent: #b48cff; --accent-fg: #1a1222; --good: #4fd18b; --bad: #ff6b81; --warn: #f0b85a;
  --F: #ff8a4c; --W: #4fb8ff; --E: #d29a63; --N: #82d35e; --S: #b07cff; --L: #f2d15b; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
h1, h2, h3 { text-wrap: balance; margin: 0 }
h1 { font-family: var(--display); font-weight: 400; font-size: 2rem; letter-spacing: .01em }
h2 { font-family: var(--display); font-weight: 400; font-size: 1.35rem }
h3 { font-size: 1rem; font-weight: 700 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 1240px; margin: 0 auto }
header.top { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: flex-end; justify-content: space-between; padding-block: 22px 14px }
.sub { color: var(--muted); font-size: .9rem }
.sync { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block }
.dot.on { background: var(--good) }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
nav.tabs button { background: none; border: 0; padding: 12px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent) }
section.panel { padding-top: 20px }
.grid2 { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr) } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0 }
.stack { display: flex; flex-direction: column; gap: 12px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.muted { color: var(--muted) }
.small { font-size: .82rem }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--muted); min-width: 0 }
label.f > span { font-weight: 600 }
input[type=text], input[type=number], select, textarea { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0 }
textarea { min-height: 70px; resize: vertical }
input[type=number] { font-family: var(--mono); font-size: .88rem }
.btn { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-weight: 600 }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
.btn.ghost { background: none }
.btn.danger { color: var(--bad) }
.btn[disabled] { opacity: .5; cursor: not-allowed }
.slot { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2) }
.slot .stripe { border-radius: 6px }
.slot .inner { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.mult { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted) }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--surface2); border: 1px solid var(--line); white-space: nowrap }
.el { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none }
.verdict { display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline }
.big { font-family: var(--display); font-size: 2.2rem; line-height: 1 }
.good { color: var(--good) } .bad { color: var(--bad) } .warn { color: var(--warn) }
.scen { display: flex; flex-wrap: wrap; gap: 6px }
.scen button { border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 6px 9px; font-size: .78rem; text-align: left; display: flex; flex-direction: column; gap: 2px }
.scen button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset }
.scen b { font-size: .82rem }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px }
table { border-collapse: collapse; width: 100%; font-size: .84rem; font-variant-numeric: tabular-nums }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top }
th { background: var(--surface2); font-weight: 700; white-space: nowrap; position: sticky; top: 0 }
td.num, th.num { text-align: right; font-family: var(--mono) }
tr:last-child td { border-bottom: 0 }
.hpbar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; min-width: 50px }
.hpbar i { display: block; height: 100% }
.chart svg { width: 100%; height: auto; display: block }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--mono) }
.pools { display: flex; flex-wrap: wrap; gap: 6px }
.progress { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s }
.q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 14px 0; border-bottom: 1px solid var(--line) }
.q:last-child { border-bottom: 0 }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap }
.seg button { border: 0; background: var(--surface2); padding: 7px 11px; font-size: .84rem; font-weight: 600; border-right: 1px solid var(--line) }
.seg button:last-child { border-right: 0 }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
@media (max-width: 640px) { .q { grid-template-columns: minmax(0, 1fr) } }
.cardlist { max-height: 70vh; overflow: auto; display: flex; flex-direction: column }
.cardlist button { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; padding: 7px 8px; border: 0; border-bottom: 1px solid var(--line); background: none }
.cardlist button[aria-current="true"] { background: var(--surface2) }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px }
.elgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px }
.elgrid label { font-size: .72rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.elgrid input { padding: 5px; font-size: .8rem }
@media (max-width: 480px) { .elgrid { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
legend { font-weight: 700; padding: 0 6px }
.note { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--surface2); border-radius: 0 8px 8px 0; font-size: .88rem }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-weight: 600; z-index: 20 }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .78rem; color: var(--muted) }
.sw { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px }
.tag-unowned { color: var(--warn); font-size: .72rem; font-weight: 700 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

  };

  for (var a = 0; a < n; a++) for (var b = a + 1; b < n; b++) for (var c = b + 1; c < n; c++) total += n - c - 1;
  var topS = [], topF = [], done = 0, lastPost = 0, t0 = Date.now();

    deck[0] = S[i];
    for (var j = i + 1; j < n; j++) {
      deck[1] = S[j];
      for (var k = j + 1; k < n; k++) {
        deck[2] = S[k];
        for (var l = k + 1; l < n; l++) {
          done++;
          if (must.length) {
            var ok = true;
            for (var q = 0; q < must.length; q++) { var mm = must[q]; if (mm !== i && mm !== j && mm !== k && mm !== l) { ok = false; break; } }

  // affinage des talents sur les 25 meilleurs
  var top = res.slice(0, 25);
  top.forEach(function (d, idx) {
    var cs = d.ids.map(function (x) { return cards[x]; });
    for (var pass = 0; pass < 2; pass++) {
      for (var p = 0; p < 4; p++) {
        for (var ti = 0; ti < cs[p].talents.length; ti++) {
          if (ti === d.tals[p]) continue;

          });
        }
      }
    }
    postMessage({ type: 'progress', phase: 'Choix des talents', done: idx + 1, total: top.length });
  });
  top.sort(function (x, y) { return y.best.avg - x.best.avg; });
  var out = top.map(function (d) {
    var kills = d.best.results.filter(function (r) { return r.tkill != null; }).map(function (r) { return r.tkill; }).sort(function (a, b) { return a - b; });
    return {
      ids: d.ids.map(function (x) { return cards[x].id; }), tals: d.tals, mult: d.best.mult,
      avg: d.best.avg, worst: d.best.worst, wins: d.best.wins, total: d.best.total, energy: Math.round(energyOf(d.ids) * 10) / 10,
      kill: kills.length ? kills[Math.floor(kills.length / 2)] : null

}

    if (infoId) updateInfo(infoId, { status: status, changes: res.changes, question: prop.question || '', undo: res.changes.length ? res.undo : null, summary: prop.summary || '' });
    return { prop: prop, res: res };
  }).finally(function () { if (infoId) { delete BUSY[infoId]; if (S.tab === 'rules') renderRules(); } });
}
function sampleErr(e) {
  var c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled') { SAMPLE_OFF = true; return 'Claude n’a pas l’autorisation sur cette page. Ton info est gardée : je l’appliquerai dans le chat.'; }
  if (c === 'rate_limited') return 'Trop de demandes pour l’instant. Réessaie dans un moment.';
  if (c === 'unavailable') return 'Claude n’est disponible que dans la version Claude du labo. Ton info est gardée.';
  return 'Claude n’a pas réussi à lire ton info. Reformule-la ou réessaie.';
}

/* ================= Onglet RÈGLES ================= */
function renderRules() {
  var qs = RULES.map(function (r) {
    var cur = S.answers[r.id];
    var seg = r.opts.map(function (o) { var v = o[0]; return '<button data-rule="' + r.id + '" data-v="' + (v === true ? 'true' : v === false ? 'false' : v) + '" aria-pressed="' + (cur === v) + '">' + esc(o[1]) + '</button>'; }).join('');
    return '<div class="q"><div class="stack" style="gap:4px;min-width:0"><b>' + esc(r.q) + '</b><span class="small muted">' + esc(r.help) + '</span>' +
      '<input type="text" class="small" data-rnote="' + r.id + '" id="rn-' + r.id + '" placeholder="D’où vient l’info ? (facultatif)" value="' + esc(S.ruleNotes[r.id] || '') + '">' +
      (S.ruleDates[r.id] ? '<span class="small muted">Réponse du ' + esc(S.ruleDates[r.id].slice(0, 10)) + '</span>' : '') + '</div><div><div class="seg">' + seg + '</div></div></div>';
  }).join('');
  var nums = NUMS.map(function (n) { return '<label class="f"><span>' + esc(n.label) + (n.unit ? ' (' + esc(n.unit) + ')' : '') + '</span><input type="number" step="' + n.step + '" data-num="' + n.id + '" id="num-' + n.id + '" value="' + S.numbers[n.id] + '"></label>'; }).join('');
  var infos = S.infos.length ? S.infos.map(function (x) {
    var busy = BUSY[x.id];
    var st = busy ? '<span class="warn">Claude lit ton info…</span>' : (x.status === 'Appliquée' ? '<span class="good">Appliquée</span>' : (x.status ? esc(x.status) : 'En attente'));
    var ch = (x.changes && x.changes.length) ? '<ul class="small" style="margin:4px 0 0;padding-left:18px">' + x.changes.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>' : '';
    var qn = x.question ? '<div class="small warn" style="margin-top:4px">' + esc(x.question) + '</div>' : '';
    var btns = (SAMPLE && !SAMPLE_OFF && !busy ? '<button class="btn small" data-applyinfo="' + esc(x.id) + '">' + (x.status ? 'Relancer Claude' : 'Appliquer avec Claude') + '</button>' : '') +
      (x.undo && !busy ? '<button class="btn ghost small" data-undoinfo="' + esc(x.id) + '">Annuler</button>' : '') +
      '<button class="btn ghost danger small" data-delinfo="' + esc(x.id) + '">Supprimer</button>';
    return '<div class="stack" style="gap:6px;padding:10px 0;border-bottom:1px solid var(--line)"><div>' + esc(x.text) + '</div><div class="small muted">' + esc((x.at || '').replace('T', ' ').slice(0, 16)) + ' · ' + st + '</div>' + ch + qn + '<div class="row">' + btns + '</div></div>';
  }).join('') : '<p class="muted small">Rien pour l\u2019instant.</p>';
  $('#panel-rules').innerHTML = '<div class="grid2"><div class="stack">' +
    '<div class="box stack"><h2>Ajouter une info</h2><p class="small muted" style="margin:0">' + (SAMPLE && !SAMPLE_OFF ? 'Une valeur vue en jeu, une règle, un patch… Claude la lit tout de suite et modifie les cartes ou les règles du simulateur. Tu peux annuler chaque changement.' : 'Une valeur vue en jeu, une règle, un patch… Sur cette version, Claude ne peut pas l\u2019appliquer lui-même : ouvre le labo depuis Claude pour que tes infos soient appliquées automatiquement.') + '</p>' +
    '<textarea id="newinfo" placeholder="Ex. : Feau de Scorch inflige aussi 10 dégâts Eau"></textarea><button class="btn primary" id="addinfo">Ajouter</button></div>' +
    '<div class="box"><h3>Infos ajoutées</h3>' + infos + '</div>' +
    '<div class="box stack"><h3>Réglages du simulateur</h3><div class="fields" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">' + nums + '</div><div><button class="btn ghost" id="resetnums">Valeurs par défaut</button></div></div>' +
    '</div><div class="box"><h2>Règles du jeu à confirmer</h2><p class="small muted">Ta réponse est enregistrée et appliquée à toutes les simulations. « Je ne sais pas » fait tester les deux possibilités.</p>' + qs + '</div></div>';
}
$('#panel-rules').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.rule) {
    var v = b.dataset.v; v = v === 'true' ? true : v === 'false' ? false : v;
    S.answers[b.dataset.rule] = v; S.ruleDates[b.dataset.rule] = new Date().toISOString();
    saveRules(); SERIES_CACHE.clear(); renderRules(); updateSubline(); toast('Réponse enregistrée'); return;
  }
  if (b.id === 'addinfo') {
    var txt = ($('#newinfo').value || '').trim(); if (!txt) return;
    var item = { text: txt, at: new Date().toISOString(), status: '' };
    var go = function (id) {
      if (!S.infos.some(function (x) { return x.id === id; })) { item.id = id; S.infos.unshift(item); }
      renderRules();
      if (SAMPLE && !SAMPLE_OFF) interpret(txt, null, id).then(function (r) { toast(r.res.changes.length ? 'Claude a appliqué ton info' : (r.prop.question ? 'Claude a une question sur ton info' : 'Rien à changer')); }, function (e) { toast(sampleErr(e)); });
      else toast('Info ajoutée');
    };
    if (DB) DB.collection('infos').add(item).then(function (ref) { go(ref.id); }).catch(function (er) { toast('Enregistrement impossible : ' + (er && er.message || er)); });
    else { go('i' + Date.now()); lsSave(); }
    $('#newinfo').value = ''; return;
  }
  if (b.dataset.applyinfo) {
    var it = S.infos.find(function (x) { return x.id === b.dataset.applyinfo; }); if (!it) return;
    if (it.undo) revertUndo(it.undo);
    interpret(it.text, it.card ? cardById(it.card) : null, it.id).then(function (r) { toast(r.res.changes.length ? 'Claude a appliqué ton info' : 'Rien à changer'); }, function (e) { toast(sampleErr(e)); });
    return;
  }
  if (b.dataset.undoinfo) {
    var it2 = S.infos.find(function (x) { return x.id === b.dataset.undoinfo; }); if (!it2 || !it2.undo) return;
    revertUndo(it2.undo); updateInfo(it2.id, { status: 'Annulée', undo: null }); renderRules(); toast('Changements annulés'); return;
  }
  if (b.dataset.delinfo) { var id = b.dataset.delinfo; if (DB) dbDelete('infos/' + id); else { S.infos = S.infos.filter(function (x) { return x.id !== id; }); lsSave(); renderRules(); } return; }
  if (b.id === 'resetnums') { NUMS.forEach(function (n) { S.numbers[n.id] = n.d; }); saveRules(); renderRules(); toast('Réglages remis par défaut'); }
});
var numTimer = null, noteTimer = null;
$('#panel-rules').addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset.num) { var v = parseFloat(t.value); if (!isNaN(v)) { S.numbers[t.dataset.num] = v; clearTimeout(numTimer); numTimer = setTimeout(saveRules, 600); } }
  if (t.dataset.rnote) { S.ruleNotes[t.dataset.rnote] = t.value; clearTimeout(noteTimer); noteTimer = setTimeout(saveRules, 800); }
});

/* ---------- Démarrage ---------- */
var startTab = 'tester';
try { var st = localStorage.getItem(LS_KEY + '-tab'); if (st) startTab = st; } catch (e) {}
if (['tester', 'search', 'cards', 'rules'].indexOf(location.hash.slice(1)) >= 0) startTab = location.hash.slice(1);
updateSubline();
showTab(startTab);
})();
</script>
</body></html>
